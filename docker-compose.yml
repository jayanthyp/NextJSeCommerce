# =============================================================================
#  NextJSeCommerce — single VPS orchestration (confirmed 7.8GB RAM / 4 CPU —
#  the original "4GB VPS" framing below undersold actual capacity, but the
#  tight per-service caps stay in place regardless; there's just more
#  headroom for `--build` and new services like meilisearch than assumed).
#
#  Memory budget (deploy.resources.limits, honoured by Compose V2 outside swarm)
#    postgres     512M   redis  192M   backend 1024M   meilisearch 512M
#    storefront   512M   caddy   64M                    = ~2.81G of hard caps
#  Expected steady-state usage is ~1.6-1.9G, leaving headroom for `--build`.
#
#  Only Caddy publishes ports. Everything else is reachable exclusively on
#  the internal `commerce` bridge network.
# =============================================================================

name: nextjs-ecommerce

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — tuned to live comfortably inside a 512M cgroup.
  # shared_buffers is deliberately 128M (25% of the cap) rather than the usual
  # 25% of host RAM; the container limit is the real ceiling here.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
      -c max_worker_processes=4
      -c max_parallel_workers=2
      -c max_parallel_workers_per_gather=1
      -c wal_buffers=8MB
      -c random_page_cost=1.1
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - commerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Redis — cache + event bus (BullMQ) + workflow engine.
  #
  # maxmemory-policy is `noeviction` ON PURPOSE. Two of those three consumers
  # store job and workflow STATE, not disposable cache: an LRU policy would
  # silently evict in-flight jobs under pressure. If Redis ever fills we want a
  # loud write error, not lost orders.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 160mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --save ""
    volumes:
      - redisdata:/data
    networks:
      - commerce
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # MeiliSearch — typo-tolerant product search, indexed by the
  # medusa-plugin-meilisearch module on product create/update/delete.
  # Internal only, no published port — same posture as postgres/redis.
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    networks:
      - commerce
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Medusa v2 engine — Store API + Admin API + bundled Admin dashboard (/app)
  # + background jobs, all in one process (MEDUSA_WORKER_MODE=shared).
  # Migrations run from the entrypoint before the server binds.
  # ---------------------------------------------------------------------------
  backend:
    # `image:` alongside `build:` is deliberate dual-mode: `docker compose
    # build`/`up --build` (bootstrap.sh, local dev, a manual VPS deploy) still
    # compiles from ./medusa exactly as before, tagging the result with this
    # name — nothing about the existing workflow changes. A CI-driven deploy
    # can instead `docker compose pull` this same tag, built once on GitHub's
    # runners and pushed to GHCR by .github/workflows/deploy-vps.yml, so the
    # VPS never has to spend its own limited RAM/CPU compiling the image.
    image: ghcr.io/jayanthyp/nextjs-ecommerce-backend:latest
    build:
      context: ./medusa
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "9000"
      # Composed here so the DB password exists in exactly one place (.env).
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      MEDUSA_WORKER_MODE: ${MEDUSA_WORKER_MODE:-shared}
      DISABLE_MEDUSA_ADMIN: "false"
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_ADMIN_KEY: ${MEILI_MASTER_KEY}
      # Node's default heap target ignores cgroup limits; pin it under the cap.
      NODE_OPTIONS: --max-old-space-size=768
    expose:
      - "9000"
    volumes:
      # Product images written by the File Local provider. Survives rebuilds.
      - medusa_uploads:/app/static
    networks:
      - commerce
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Generous: covers migrations on a cold database.
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.50"
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Next.js App Router storefront (standalone output).
  #
  # NEXT_PUBLIC_* are build-time inlined -> they are build args, not just env.
  # Changing one needs `docker compose build --no-cache storefront`.
  # ---------------------------------------------------------------------------
  storefront:
    # See the `image:` comment on `backend`, above — same dual build/pull mode.
    image: ghcr.io/jayanthyp/nextjs-ecommerce-storefront:latest
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-dk}
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
        NEXT_PUBLIC_SEARCH_ENDPOINT: ${NEXT_PUBLIC_SEARCH_ENDPOINT:-}
        NEXT_PUBLIC_SEARCH_API_KEY: ${NEXT_PUBLIC_SEARCH_API_KEY:-}
        NEXT_PUBLIC_SEARCH_INDEX_NAME: ${NEXT_PUBLIC_SEARCH_INDEX_NAME:-products}
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
        NEXT_PUBLIC_WHATSAPP_SUPPORT_NUMBER: ${NEXT_PUBLIC_WHATSAPP_SUPPORT_NUMBER:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Runtime, server-side only: Server Components / Server Actions reach
      # Medusa over internal Docker DNS instead of going back out through Caddy.
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL_INTERNAL:-http://backend:9000}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-dk}
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
      NEXT_PUBLIC_SEARCH_ENDPOINT: ${NEXT_PUBLIC_SEARCH_ENDPOINT:-}
      NEXT_PUBLIC_SEARCH_API_KEY: ${NEXT_PUBLIC_SEARCH_API_KEY:-}
      NEXT_PUBLIC_SEARCH_INDEX_NAME: ${NEXT_PUBLIC_SEARCH_INDEX_NAME:-products}
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
      NEXT_PUBLIC_WHATSAPP_SUPPORT_NUMBER: ${NEXT_PUBLIC_WHATSAPP_SUPPORT_NUMBER:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      NODE_OPTIONS: --max-old-space-size=384
    expose:
      - "3000"
    networks:
      - commerce
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Not `/` — that route redirects through the region middleware, which
      # loops forever against a cookie-less client like wget. /api/health
      # bypasses the middleware entirely (see its matcher in middleware.ts).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.00"
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # Caddy — TLS termination + reverse proxy. Certificates live in the named
  # volume `caddy_data`; losing it means re-issuing certs and risking Let's
  # Encrypt rate limits, so never `docker compose down -v` casually.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      STORE_DOMAIN: ${STORE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CADDY_LOCAL_CERTS: ${CADDY_LOCAL_CERTS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - commerce
    depends_on:
      - backend
      - storefront
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
        reservations:
          memory: 32M

networks:
  commerce:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  meilidata:
  medusa_uploads:
  caddy_data:
  caddy_config:
