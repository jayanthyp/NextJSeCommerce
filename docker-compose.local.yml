# =============================================================================
#  Local development overlay
#
#  Layered on top of docker-compose.yml — never used alone:
#      docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
#  Deliberately NOT named docker-compose.override.yml: Compose loads that file
#  automatically, so a checkout on the VPS would silently pick up these
#  loosened limits and published database ports.
#
#  Differences from production:
#    - application ports are published to the host (production publishes none
#      except Caddy's 80/443)
#    - Postgres and Redis are reachable from Windows for psql / redis-cli / a
#      GUI client
#    - Caddy is parked behind a profile: there are no public domains to get
#      certificates for, so the browser talks to the apps directly
#    - the backend cap is raised, because seeding and heavy Admin use are
#      spikier than the steady-state serving the 4GB budget was tuned for
# =============================================================================

services:
  # Host ports are overridable because a dev machine usually already has a
  # Postgres or Redis bound to the default port from another project. The
  # container-side ports never change, so nothing inside the stack cares.
  postgres:
    ports:
      - "127.0.0.1:${LOCAL_PG_PORT:-5433}:5432"

  redis:
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-6379}:6379"

  # Published directly for local dev since Caddy (which proxies /search in
  # production) is parked behind the `proxy` profile by default — point
  # NEXT_PUBLIC_SEARCH_ENDPOINT at http://localhost:7700 for local testing.
  meilisearch:
    ports:
      - "127.0.0.1:${LOCAL_MEILI_PORT:-7700}:7700"

  backend:
    ports:
      - "9000:9000"
    environment:
      # Verbose logs are worth the noise locally.
      LOG_LEVEL: debug
      NODE_OPTIONS: --max-old-space-size=1536
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.00"

  storefront:
    ports:
      - "3000:3000"

  # Parked behind a profile so a plain `up -d` skips it. Nothing here has a
  # public domain, so Caddy would spend its time failing ACME challenges.
  # Start it deliberately with `--profile proxy` if you want to test the
  # reverse-proxy layer (set CADDY_LOCAL_CERTS=local_certs first).
  caddy:
    profiles:
      - proxy

  # Fake SMTP server for local testing — accepts any mail the backend sends
  # (order confirmations, abandoned-cart reminders, back-in-stock alerts)
  # without actually delivering it anywhere, and shows the rendered HTML in
  # a web UI at http://localhost:8025. Point SMTP_HOST=mailpit, SMTP_PORT=
  # 1025, SMTP_SECURE=false at it; SMTP_USER/SMTP_PASS can be any non-empty
  # value since Mailpit doesn't enforce auth by default — the backend's own
  # SMTP_ENABLED gate just requires them to be *present*.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
