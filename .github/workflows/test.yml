name: Test

# Runs on every push/PR for visibility, AND as a reusable workflow
# (workflow_call) so deploy-vps.yml can `needs:` it. Only backend-tests and
# storefront-unit actually gate a deploy (via the outputs below) —
# storefront-e2e still runs here on every push/PR so failures stay visible,
# but deploy-vps.yml deliberately doesn't wait on it (see that file's
# `deploy` job for why: it's the slowest job and its failures are usually
# either flakiness or caught well before a merge reaches `main`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      backend-tests-result:
        description: "Result of the backend-tests job"
        value: ${{ jobs.backend-tests.result }}
      storefront-unit-result:
        description: "Result of the storefront-unit job"
        value: ${{ jobs.storefront-unit.result }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa_test_password
          POSTGRES_DB: medusa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: medusa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: medusa/package-lock.json

      # setup-node's `cache: npm` only caches the download cache (~/.npm) —
      # `npm ci` always wipes and reinstalls node_modules from scratch
      # regardless, re-running every install/link/postinstall step every
      # run. Caching node_modules itself lets an unchanged lockfile skip
      # the install entirely, which is where nearly all of this job's time
      # was going (~24 of ~26 minutes).
      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: medusa/node_modules
          key: medusa-node-modules-${{ runner.os }}-${{ hashFiles('medusa/package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run test database migrations
        run: npx medusa db:migrate
        env:
          DATABASE_URL: postgres://medusa:medusa_test_password@localhost:5432/medusa_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-not-for-production-use
          COOKIE_SECRET: test-cookie-secret-not-for-production-use
          STORE_CORS: http://localhost:3000
          ADMIN_CORS: http://localhost:9000
          AUTH_CORS: http://localhost:3000,http://localhost:9000

      - run: npm run test:unit
      - run: npm run test:integration:modules

      - name: Run HTTP integration tests
        id: http_tests
        run: npm run test:integration:http 2>&1 | tee /tmp/http-tests.log

      # Surfaces the actual failure text as a check annotation (readable via
      # the public REST API without a token) — the raw job log itself needs
      # write/admin repo access to download, which isn't available for
      # unauthenticated diagnosis.
      - name: Surface HTTP integration test failure
        if: failure() && steps.http_tests.outcome == 'failure'
        run: |
          echo "::group::HTTP integration test failure tail"
          tail -100 /tmp/http-tests.log
          echo "::endgroup::"
          tail -80 /tmp/http-tests.log | while IFS= read -r line; do
            # Strip characters that break the ::error:: annotation format.
            safe="${line//$'\r'/}"
            safe="${safe//$'\n'/ }"
            echo "::error::${safe}"
          done

  storefront-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: storefront/node_modules
          key: storefront-node-modules-${{ runner.os }}-${{ hashFiles('storefront/package-lock.json') }}

      - if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run test:unit

  storefront-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway secrets for the local stack
        run: |
          cat > .env <<EOF
          POSTGRES_USER=medusa
          POSTGRES_PASSWORD=ci_test_password
          POSTGRES_DB=medusa
          REDIS_URL=redis://redis:6379
          JWT_SECRET=ci-jwt-secret
          COOKIE_SECRET=ci-cookie-secret
          MEILI_MASTER_KEY=ci-meili-master-key-not-for-production
          MEDUSA_WORKER_MODE=shared
          MEDUSA_BACKEND_URL=http://localhost:9000
          MEDUSA_BACKEND_URL_INTERNAL=http://backend:9000
          STORE_CORS=http://localhost:3000,http://localhost:8000
          ADMIN_CORS=http://localhost:9000
          AUTH_CORS=http://localhost:3000,http://localhost:9000
          NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://localhost:9000
          NEXT_PUBLIC_BASE_URL=http://localhost:3000
          NEXT_PUBLIC_DEFAULT_REGION=dk
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=
          EOF

      - name: Build and start the full local stack
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build postgres redis backend

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker compose -f docker-compose.yml -f docker-compose.local.yml ps backend --format '{{.Status}}')
            echo "$status"
            echo "$status" | grep -q healthy && exit 0
            sleep 5
          done
          echo "Backend never became healthy" && exit 1

      - name: Seed the database
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T backend npx medusa exec ./src/scripts/seed.js

      # seed.js only creates the "Europe" region (gb/de/dk/se/fr/es/it). The
      # storefront's SELECTABLE_COUNTRY_CODES (see storefront/src/lib/constants.tsx,
      # from issue #15) restricts the country-select dropdown to India/Australia
      # only, and production already has those regions via this same script
      # (see docs/india-launch-readiness.md's "Confirmed already in place" note)
      # — CI's ephemeral stack never ran it, so every `/in/...` and `/au/...`
      # URL 404'd outright (middleware can't resolve a region for an unlisted
      # country), which is what was actually breaking e2e on every spec that
      # navigates through a country-coded URL (root-caused on issue #33/#28).
      - name: Add India/Australia/etc regions (matching production setup)
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T backend npx medusa exec ./src/scripts/add-global-regions.js

      - name: Create a temp admin user to read the publishable key
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T backend npx medusa user -e ci@test.local -p CiTestPassword123!

      - name: Wait for the seeded products to reach the MeiliSearch index
        run: |
          for i in $(seq 1 30); do
            count=$(curl -s http://localhost:7700/indexes/products/stats \
              -H "Authorization: Bearer ci-meili-master-key-not-for-production" \
              | node -pe 'JSON.parse(require("fs").readFileSync(0)).numberOfDocuments || 0')
            echo "indexed documents: $count"
            [ "$count" -gt 0 ] && exit 0
            sleep 5
          done
          echo "MeiliSearch never indexed the seeded products" && exit 1

      - name: Capture the publishable + search keys and rebuild storefront with them
        run: |
          TOKEN=$(curl -s -X POST http://localhost:9000/auth/user/emailpass \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@test.local","password":"CiTestPassword123!"}' \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          KEY=$(curl -s http://localhost:9000/admin/api-keys?type=publishable \
            -H "Authorization: Bearer $TOKEN" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).api_keys[0].token')
          echo "NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=$KEY" >> .env

          # MeiliSearch auto-generates a scoped "Default Search API Key" (actions:
          # ["search"]) alongside the admin key when it boots with a master key —
          # that's the one the browser-side search client is allowed to use, never
          # the master key itself.
          SEARCH_KEY=$(curl -s http://localhost:7700/keys \
            -H "Authorization: Bearer ci-meili-master-key-not-for-production" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).results.find(k => JSON.stringify(k.actions) === JSON.stringify(["search"])).key')
          echo "NEXT_PUBLIC_SEARCH_ENDPOINT=http://localhost:7700" >> .env
          echo "NEXT_PUBLIC_SEARCH_API_KEY=$SEARCH_KEY" >> .env

          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build storefront

      - name: Wait for storefront to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker compose -f docker-compose.yml -f docker-compose.local.yml ps storefront --format '{{.Status}}')
            echo "$status"
            echo "$status" | grep -q healthy && exit 0
            sleep 5
          done
          echo "Storefront never became healthy" && exit 1

      # `backend` has `env_file: [.env]` in docker-compose.yml, so it loads the
      # whole file, not just the vars it lists under `environment:`. The
      # previous step's `.env` append (publishable/search keys) therefore
      # changes backend's config hash too — even though that step's `up -d
      # --build storefront` only targeted storefront, compose silently
      # recreates backend as a side effect. Playwright then started against a
      # backend that could still be mid-restart, causing product-data calls to
      # intermittently return nothing (root-caused on issue #28 after the
      # PR #34 timeout theory turned out not to be the actual cause).
      - name: Wait for backend to be healthy (post-storefront-rebuild)
        run: |
          for i in $(seq 1 30); do
            status=$(docker compose -f docker-compose.yml -f docker-compose.local.yml ps backend --format '{{.Status}}')
            echo "$status"
            echo "$status" | grep -q healthy && exit 0
            sleep 5
          done
          echo "Backend never became healthy after the storefront rebuild recreated it" && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - uses: actions/cache@v4
        id: storefront-node-modules-cache
        with:
          path: storefront/node_modules
          key: storefront-node-modules-${{ runner.os }}-${{ hashFiles('storefront/package-lock.json') }}

      - name: Install Playwright + browsers
        working-directory: storefront
        run: |
          if [ "${{ steps.storefront-node-modules-cache.outputs.cache-hit }}" != "true" ]; then
            npm ci --prefer-offline --no-audit --no-fund
          fi
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: storefront
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: storefront/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v
