name: LangGraph Agentic SDLC Trigger

on:
  issues:
    # `opened` is deliberately omitted. Creating an issue with labels fires
    # `opened` PLUS one `labeled` per label (e.g. `bug` + `status:ready-for-ui-work`
    # -> 3 webhook events -> 3 concurrent graph runs all racing on the same
    # issue). trigger.ts re-derives routing from the live `status:*` label, and
    # the status label's own `labeled` event already fires at creation, so
    # `opened` is a pure duplicate. Non-status `labeled` events (e.g. `bug`) are
    # ignored inside trigger.ts via --label.
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_run:
    # Re-invokes the graph the moment a PR's CI finishes. The E2E and Ship
    # stages wait for a PR's checks and end the run while they're pending
    # (leaving status:ready-for-qa / status:ready-to-ship, steady wait states
    # the stuck-issue sweep doesn't cover); without this trigger, PRs
    # #142/#144/#146 sat CI-green for long stretches until a human nudged
    # them. "Test" is test.yml's `name:` — its completion is the actual
    # "CI just went green/red" signal for the linked issue.
    workflows: ["Test"]
    types: [completed]
  schedule:
    # Stuck-issue recovery: relabel issues orphaned in a transient label and
    # re-run their node (see scripts/recover-stuck-issues.ts), plus
    # closed-issue reconciliation (see scripts/reconcile-closed-issues.ts).
    # Off the :00/:30 marks; every 30 minutes.
    - cron: '7,37 * * * *'

# One graph run per issue at a time: an owner answering Grill-me twice, or a
# label and a comment landing together, must not race the same issue. Runs
# for different issues stay parallel; cron and workflow_run runs (no issue in
# the payload) each get their own group.
concurrency:
  group: sdlc-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

# GITHUB_TOKEN's default permissions can be read-only depending on repo/org
# settings, which would silently 403 on `gh issue edit`/`gh pr create` inside
# trigger.ts. Every node except tech-lead's approve/merge/rollback acts under
# this token (via GH_TOKEN below), so it needs write access to all three.
# `actions: write` additionally lets tech-lead's deploy step dispatch
# deploy-vps.yml (`gh workflow run`) — without it that call 403s with
# "Resource not accessible by integration".
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  run-langgraph-agent:
    # Guardrail: Prevent infinite execution loops by ignoring comments/actions made by bot accounts
    if: ${{ !github.event.comment.user.login || !endsWith(github.event.comment.user.login, '[bot]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A `labeled` event fires once per label applied at issue creation (see
      # the `on.issues` comment above) — only the `status:*` one is routable,
      # the rest (`bug`, `priority:*`, ...) are pure no-ops in trigger.ts. That
      # filter used to live only inside trigger.ts, which meant every one of
      # those no-op runs still paid for `npm ci` x3 + Playwright browser
      # install (~1-2 CI minutes) before reaching the cheap check. Mirror the
      # same filter here, before any setup step, so non-status `labeled`
      # events short-circuit in seconds instead.
      - name: Check if this event needs the full setup
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.action }}" = "labeled" ]; then
            LABEL="${{ github.event.label.name }}"
            case "$LABEL" in
              status:*) echo "should_run=true" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "[gate] labeled \"$LABEL\" is not a status:* label — nothing to route, skipping setup"
                echo "should_run=false" >> "$GITHUB_OUTPUT"
                ;;
            esac
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # "Test" also runs on push-to-main (post-merge) and other branches
            # with no open PR at all — only a pull_request-triggered run maps
            # to a linked issue worth waking tech-lead up for.
            if [ "${{ github.event.workflow_run.event }}" != "pull_request" ]; then
              echo "[gate] workflow_run not from a pull_request (was: ${{ github.event.workflow_run.event }}) — skipping"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            else
              BRANCH="${{ github.event.workflow_run.head_branch }}"
              ISSUE=$(gh pr list --repo jayanthyp/NextJSeCommerce --head "$BRANCH" --state open --json body \
                --jq '.[0].body // ""' | grep -oE 'Closes #[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
              if [ -z "$ISSUE" ]; then
                echo "[gate] no open PR with a linked issue for branch $BRANCH — skipping"
                echo "should_run=false" >> "$GITHUB_OUTPUT"
              else
                echo "[gate] workflow_run for branch $BRANCH resolves to issue #$ISSUE"
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                echo "resolved_issue=$ISSUE" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js Environment
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: npm ci

      # The build stage runs `npm run test:unit` in both workspaces, so their
      # dependencies must be installed too (root `npm ci` only covers the
      # LangGraph orchestrator project itself).
      - name: Install Storefront Dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: npm ci
        working-directory: storefront

      - name: Install Medusa Dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: npm ci
        working-directory: medusa

      - name: Install Playwright Browsers (for QA Node)
        if: steps.gate.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      # The design and build stages run `git commit` / `git push`; the runner
      # has no git identity by default ("Author identity unknown").
      - name: Configure Git Identity
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # `gh issue edit --add-label` fails on a label that doesn't exist yet.
      - name: Ensure pipeline labels exist
        if: steps.gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/ensure-labels.ts

      # OmniRoute (model gateway) and claude-mem (memory) run on the VPS bound
      # to 127.0.0.1 only — never exposed publicly. Forward both ports over SSH
      # with the key the deploy job already uses. Each URL is exported only if
      # its service answers, so a missing or stopped service degrades cleanly:
      # no OmniRoute → llm.ts goes straight to DeepSeek; no claude-mem → no
      # memory. See docs/agentic-pipeline-vps.md for the VPS side.
      - name: Open SSH tunnel to OmniRoute + claude-mem on the VPS
        if: steps.gate.outputs.should_run == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "[tunnel] VPS secrets not set — running without OmniRoute and memory"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key && chmod 600 ~/.ssh/vps_key
          # Pin the host key when VPS_SSH_KNOWN_HOSTS is set (recommended);
          # otherwise trust on first use, like the deploy job's ssh-action.
          if [ -n "$VPS_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            HOSTKEY="StrictHostKeyChecking=yes"
          else
            HOSTKEY="StrictHostKeyChecking=accept-new"
          fi
          if ! ssh -i ~/.ssh/vps_key -o "$HOSTKEY" -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ConnectTimeout=15 \
            -f -N -L 20128:127.0.0.1:20128 -L 37777:127.0.0.1:37777 "$VPS_USER@$VPS_HOST"; then
            echo "[tunnel] SSH to the VPS failed — running without OmniRoute and memory"
            exit 0
          fi
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:37777/api/health && break
            sleep 1
          done
          if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:37777/api/health; then
            echo "CLAUDE_MEM_URL=http://127.0.0.1:37777" >> "$GITHUB_ENV"
            echo "[tunnel] claude-mem reachable"
          else
            echo "[tunnel] claude-mem not answering — running without memory"
          fi
          if [ -n "$OMNIROUTE_API_KEY" ] && curl -fsS -o /dev/null --max-time 5 -H "Authorization: Bearer $OMNIROUTE_API_KEY" http://127.0.0.1:20128/v1/models; then
            echo "OMNIROUTE_BASE_URL=http://127.0.0.1:20128" >> "$GITHUB_ENV"
            echo "[tunnel] OmniRoute reachable"
          else
            echo "[tunnel] OmniRoute not answering (or OMNIROUTE_API_KEY unset) — models go straight to the direct provider"
          fi

      - name: Execute LangGraph Orchestrator
        if: steps.gate.outputs.should_run == 'true'
        env:
          # Model providers, tried in order (src/agents/llm.ts):
          #  1. OmniRoute on the VPS — OMNIROUTE_BASE_URL comes from the tunnel
          #     step; each role is a combo that spends free-tier models first
          #     and ends with DeepSeek.
          #  2. Direct DeepSeek — the pre-existing three secrets:
          #       ANTHROPIC_API_KEY  = DeepSeek API key
          #       ANTHROPIC_BASE_URL = https://api.deepseek.com/anthropic
          #       ANTHROPIC_MODEL    = deepseek-v4-pro (NOT [1m] — thinking mode breaks tool calls)
          #     (Leave ANTHROPIC_BASE_URL empty with a real Anthropic key to use
          #     Claude Opus/Sonnet/Haiku directly instead.)
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_ORCHESTRATOR_COMBO: ${{ vars.OMNIROUTE_ORCHESTRATOR_COMBO }}
          OMNIROUTE_WORKER_COMBO: ${{ vars.OMNIROUTE_WORKER_COMBO }}
          OMNIROUTE_WORKER_LIGHT_COMBO: ${{ vars.OMNIROUTE_WORKER_LIGHT_COMBO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}

          # Stage 6 reviewer: TypeSafe Jev. Thresholds are optional repo
          # Variables (defaults in src/agents/config.ts).
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_BASE_URL: ${{ vars.JEV_BASE_URL }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
          JEV_PASS_THRESHOLD: ${{ vars.JEV_PASS_THRESHOLD }}
          JEV_MAX_COMPLEXITY: ${{ vars.JEV_MAX_COMPLEXITY }}
          MAX_JEV_ROUNDS: ${{ vars.MAX_JEV_ROUNDS }}

          # GitHub API Access
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Separate tech-lead bot identity — required by
          # scripts/tech-lead-approve.sh/-merge.sh/-rollback-revert.sh (the
          # Ship stage). Must be a DIFFERENT account than GITHUB_TOKEN's
          # github-actions[bot] identity: every other stage (PR creation,
          # issue comments) posts as github-actions[bot], and GitHub refuses
          # to let an account approve its own PR. One-time setup: CLAUDE.md's
          # "Tech-lead bot identity setup".
          TECH_LEAD_GH_TOKEN: ${{ secrets.TECH_LEAD_GH_TOKEN }}

          # LangSmith Observability & Tracing Configuration
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: "e-commerce-sdlc"
          LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"

          # Post-deploy smoke-test targets (production VPS endpoints) — the
          # storefront + API domains the Ship stage pings before merging.
          # SMOKE_* (not NEXT_PUBLIC_*): NEXT_PUBLIC_BASE_URL is the
          # storefront's own build-time var, and the build stage runs unit
          # tests as children of this process, so reusing that name leaks the
          # production URL into those tests and breaks their localhost
          # assertions.
          SMOKE_BASE_URL: "https://structuracrafts.store"
          SMOKE_MEDUSA_BACKEND_URL: "https://api.structuracrafts.store"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "♻️ Running stuck-issue recovery (schedule trigger)"
            npx tsx scripts/recover-stuck-issues.ts
            echo "🧹 Running closed-issue reconciliation (schedule trigger)"
            npx tsx scripts/reconcile-closed-issues.ts
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            ISSUE_NUMBER="${{ steps.gate.outputs.resolved_issue }}"
            echo "🚀 CI completed for issue #${ISSUE_NUMBER}'s PR — triggering LangGraph..."
            npx tsx scripts/trigger.ts \
              --issue "${ISSUE_NUMBER}" \
              --event workflow_run \
              --action completed
            exit 0
          fi

          # Extract issue number based on event type
          ISSUE_NUMBER="${{ github.event.issue.number }}"

          echo "🚀 Triggering LangGraph for Issue #${ISSUE_NUMBER}..."

          # Execute the TypeScript trigger script passing the GitHub event context
          npx tsx scripts/trigger.ts \
            --issue "${ISSUE_NUMBER}" \
            --event "${{ github.event_name }}" \
            --action "${{ github.event.action }}" \
            --label "${{ github.event.label.name }}"