name: Build images and deploy to VPS (prod)

# Builds happen here, on GitHub's runners — not on the 4GB VPS. The whole
# point of docker-compose.yml's dual build/image mode (see its comments on
# the backend/storefront services) is that the VPS only ever runs
# `docker compose pull && up -d` (scripts/deploy.sh), never a build: Admin
# bundling and the Next.js compile were always the real memory risk on that
# box, and this removes it from the deploy path entirely.
on:
  push:
    branches: [main]
    paths:
      - "medusa/**"
      - "storefront/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false # never cancel a deploy that's already mid-flight

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/nextjs-ecommerce-backend
  STOREFRONT_IMAGE: ghcr.io/${{ github.repository_owner }}/nextjs-ecommerce-storefront

jobs:
  # Gates the two build jobs on what actually changed, so e.g. a
  # storefront-only commit doesn't waste minutes rebuilding the backend image
  # (docker-compose.yml/Caddyfile changes intentionally fall through to
  # "backend" too, since those affect what deploy.sh restarts either way).
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      storefront: ${{ steps.filter.outputs.storefront }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'medusa/**'
              - 'docker-compose.yml'
              - 'Caddyfile'
            storefront:
              - 'storefront/**'
              - 'docker-compose.yml'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./medusa
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-storefront:
    needs: changes
    if: needs.changes.outputs.storefront == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_* are build-time inlined (see storefront/Dockerfile) —
      # these have to be the real production VPS/domain values, which is why
      # they come from repo Variables (Settings -> Secrets and variables ->
      # Actions -> Variables) rather than being hardcoded: none of them are
      # actually sensitive (a publishable key is, by design, meant to be
      # embedded in public JS), so Variables — not Secrets — are the correct
      # place for them.
      - uses: docker/build-push-action@v6
        with:
          context: ./storefront
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.STOREFRONT_IMAGE }}:latest
            ${{ env.STOREFRONT_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ vars.NEXT_PUBLIC_DEFAULT_REGION }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront

  deploy:
    needs: [build-backend, build-storefront]
    # Proceed as long as neither build actually FAILED — a job that was
    # correctly skipped (nothing relevant changed) shouldn't block deploying
    # the other one that did.
    if: |
      always() && !cancelled() &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-storefront.result == 'success' || needs.build-storefront.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run deploy.sh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /opt/NextJSeCommerce
            ./scripts/deploy.sh
