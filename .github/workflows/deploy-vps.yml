name: Build images and deploy to VPS (prod)

# Builds happen here, on GitHub's runners — not on the 4GB VPS. The whole
# point of docker-compose.yml's dual build/image mode (see its comments on
# the backend/storefront services) is that the VPS only ever runs
# `docker compose pull && up -d` (scripts/deploy.sh), never a build: Admin
# bundling and the Next.js compile were always the real memory risk on that
# box, and this removes it from the deploy path entirely.
on:
  push:
    branches: [main]
    paths:
      - "medusa/**"
      - "storefront/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false # never cancel a deploy that's already mid-flight

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/nextjs-ecommerce-backend
  STOREFRONT_IMAGE: ghcr.io/${{ github.repository_owner }}/nextjs-ecommerce-storefront

jobs:
  # Gates the two build jobs on what actually changed, so e.g. a
  # storefront-only commit doesn't waste minutes rebuilding the backend image
  # (docker-compose.yml/Caddyfile changes intentionally fall through to
  # "backend" too, since those affect what deploy.sh restarts either way).
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      storefront: ${{ steps.filter.outputs.storefront }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'medusa/**'
              - 'docker-compose.yml'
              - 'Caddyfile'
            storefront:
              - 'storefront/**'
              - 'docker-compose.yml'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./medusa
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-storefront:
    needs: changes
    if: needs.changes.outputs.storefront == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # NEXT_PUBLIC_* are build-time inlined (see storefront/Dockerfile) —
      # these have to be the real production VPS/domain values, which is why
      # they come from repo Variables (Settings -> Secrets and variables ->
      # Actions -> Variables) rather than being hardcoded: none of them are
      # actually sensitive (a publishable key is, by design, meant to be
      # embedded in public JS), so Variables — not Secrets — are the correct
      # place for them.
      - uses: docker/build-push-action@v6
        with:
          context: ./storefront
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.STOREFRONT_IMAGE }}:latest
            ${{ env.STOREFRONT_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ vars.NEXT_PUBLIC_DEFAULT_REGION }}
            NEXT_PUBLIC_GA4_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}
            NEXT_PUBLIC_SEARCH_ENDPOINT=${{ vars.NEXT_PUBLIC_SEARCH_ENDPOINT }}
            NEXT_PUBLIC_SEARCH_API_KEY=${{ vars.NEXT_PUBLIC_SEARCH_API_KEY }}
            NEXT_PUBLIC_SEARCH_INDEX_NAME=${{ vars.NEXT_PUBLIC_SEARCH_INDEX_NAME }}
            NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_AUTH_ENABLED }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront

  # Reusable workflow_call — cross-workflow-file `needs:` isn't otherwise
  # possible in GitHub Actions, so this is how backend-tests/storefront-unit
  # block a production deploy. See test.yml for what actually runs.
  #
  # storefront-e2e (Playwright) is disabled in CI (see test.yml's `if: false`
  # on that job, per owner decision 2026-08-10), so it neither runs as part of
  # this call nor gates `deploy`. Playwright e2e now runs via the
  # quality-analyst agent against each PR's branch in an isolated local stack.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [build-backend, build-storefront, test]
    # Proceed as long as neither build actually FAILED — a job that was
    # correctly skipped (nothing relevant changed) shouldn't block deploying
    # the other one that did. Of `test`'s sub-jobs, only backend-tests and
    # storefront-unit have to pass — storefront-e2e is disabled (see test.yml),
    # so the gate relies on `always()` + explicit per-job outputs (not
    # `needs.test.result`) for backend-tests/storefront-unit only.
    if: |
      always() && !cancelled() &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-storefront.result == 'success' || needs.build-storefront.result == 'skipped') &&
      needs.test.outputs.backend-tests-result == 'success' &&
      needs.test.outputs.storefront-unit-result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run deploy.sh
        uses: appleboy/ssh-action@v1
        env:
          # appleboy/ssh-action's `envs:` input only forwards names already
          # present in this step's own env context — it doesn't read
          # `secrets.*` by name itself, so they have to be mapped in here
          # first.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Most of the VPS's .env is provisioned once at bootstrap and never
          # touched by CI (DB/JWT/cookie secrets, SMTP, etc. — see
          # deploy.sh's own comment on why deploys stay pull-only). These
          # three are the exception: optional integrations that get
          # configured well after initial setup, so syncing them from
          # GitHub Secrets on every deploy means enabling one is just
          # "add the secret, push" instead of an extra SSH session. Each is
          # only touched when its secret is actually set, so leaving one
          # empty here doesn't blank out a value already on the server.
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,MAILERLITE_API_KEY
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /opt/NextJSeCommerce
            sync_env_secret() {
              local key="$1" value="$2"
              [ -n "$value" ] || return 0
              grep -v "^${key}=" .env > .env.tmp || true
              mv .env.tmp .env
              echo "${key}=${value}" >> .env
            }
            sync_env_secret GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
            sync_env_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
            sync_env_secret MAILERLITE_API_KEY "$MAILERLITE_API_KEY"
            ./scripts/deploy.sh
